<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="refresh" content="60">
<meta name="viewport" content="width=600, height=800, user-scalable=no">
<title>Kindle</title>
<style type="text/css">
html, body {
  margin: 0;
  padding: 0;
  width: 600px;
  height: 800px;
  overflow: hidden;
  background: #ffffff;
  color: #000000;
  font-family: Georgia, "Times New Roman", serif;
}
.stage {
  width: 728px;
  height: 582px;
  overflow: hidden;
  -webkit-transform-origin: 0 0;
  -webkit-transform: translate(0, 68px) rotate(90deg) translate(0, -582px);
  transform-origin: 0 0;
  transform: translate(0, 68px) rotate(90deg) translate(0, -582px);
}
table.frame {
  width: 728px;
  height: 582px;
  border-collapse: collapse;
  table-layout: fixed;
}
td {
  padding: 0;
}
.hdr {
  height: 88px;
  background: #000000;
  color: #ffffff;
}
.hdr-inner {
  width: 100%;
  border-collapse: collapse;
}
.hdr-left {
  padding: 18px 0 16px 28px;
  vertical-align: middle;
  width: 55%;
}
.hdr-right {
  padding: 12px 28px 12px 0;
  vertical-align: middle;
  text-align: right;
  width: 45%;
}
.weekday {
  font-size: 18px;
  letter-spacing: 4px;
  text-transform: uppercase;
}
.date {
  font-size: 24px;
  padding-top: 4px;
}
.time {
  font-size: 50px;
  font-weight: bold;
  letter-spacing: -1px;
  line-height: 1;
}
.body {
  height: 376px;
}
.body-inner {
  width: 100%;
  height: 376px;
  border-collapse: collapse;
  table-layout: fixed;
}
.now {
  width: 250px;
  padding: 20px 16px 16px 22px;
  vertical-align: middle;
  border-right: 3px solid #000000;
}
.temp {
  font-size: 80px;
  font-weight: bold;
  line-height: 0.88;
}
.cond {
  font-size: 22px;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding-top: 8px;
}
.meta {
  font-size: 18px;
  padding-top: 8px;
}
.fc-wrap {
  width: 478px;
  padding: 8px 18px 8px 16px;
  vertical-align: middle;
}
.hours {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}
.hours td {
  padding: 12px 6px;
  border-top: 2px solid #000000;
  vertical-align: middle;
}
.hours tr.first td {
  border-top: 0;
}
.h-time {
  width: 90px;
  font-size: 22px;
}
.h-temp {
  width: 90px;
  font-size: 34px;
  font-weight: bold;
  line-height: 1;
}
.h-cond {
  font-size: 22px;
  text-transform: uppercase;
}
.msg-cell {
  height: 118px;
  padding: 18px 22px 16px 22px;
  vertical-align: middle;
  background: #000000;
  color: #ffffff;
}
.msg {
  font-size: 28px;
  line-height: 1.3;
}
</style>
</head>
<body>
<div class="stage">
<table class="frame" cellspacing="0" cellpadding="0">
  <tr>
    <td class="hdr">
      <table class="hdr-inner" cellspacing="0" cellpadding="0">
        <tr>
          <td class="hdr-left">
            <div class="weekday" id="weekday">Friday</div>
            <div class="date" id="date">August 21, 2026</div>
          </td>
          <td class="hdr-right">
            <div class="time" id="time">12:17</div>
          </td>
        </tr>
      </table>
    </td>
  </tr>
  <tr>
    <td class="body">
      <table class="body-inner" cellspacing="0" cellpadding="0">
        <tr>
          <td class="now">
            <div class="temp">--°</div>
            <div class="cond">Weather unavailable</div>
            <div class="meta">Linz &nbsp;&middot;&nbsp; Linz</div>
          </td>
          <td class="fc-wrap"><div class='h-cond'>No hourly forecast today</div></td>
        </tr>
      </table>
    </td>
  </tr>
  <tr>
    <td class="msg-cell">
      <div class="msg">Could not load gist.</div>
    </td>
  </tr>
</table>
</div>
<script type="text/javascript">
(function () {
  var months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function tick() {
    var d = new Date();
    var w = document.getElementById("weekday");
    var da = document.getElementById("date");
    var t = document.getElementById("time");
    if (w) w.innerHTML = days[d.getDay()];
    if (da) da.innerHTML = months[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear();
    if (t) t.innerHTML = pad(d.getHours()) + ":" + pad(d.getMinutes());
  }
  tick();
  setInterval(tick, 15000);
})();
</script>
</body>
</html>
