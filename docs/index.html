<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="refresh" content="60">
<meta name="viewport" content="width=600, height=800, user-scalable=no">
<title>Kindle</title>
<style type="text/css">
html, body {
  margin: 0;
  padding: 0;
  width: 600px;
  height: 800px;
  overflow: hidden;
  background: #ffffff;
  color: #000000;
  font-family: Georgia, "Times New Roman", serif;
}
table.frame {
  width: 600px;
  height: 800px;
  border-collapse: collapse;
  table-layout: fixed;
}
td {
  padding: 0;
}
.hdr {
  height: 168px;
  background: #000000;
  color: #ffffff;
}
.hdr-inner {
  width: 100%;
  border-collapse: collapse;
}
.hdr-left {
  padding: 28px 0 24px 32px;
  vertical-align: middle;
  width: 58%;
}
.hdr-right {
  padding: 20px 32px 20px 0;
  vertical-align: middle;
  text-align: right;
  width: 42%;
}
.weekday {
  font-size: 22px;
  letter-spacing: 4px;
  text-transform: uppercase;
}
.date {
  font-size: 28px;
  padding-top: 10px;
}
.time {
  font-size: 72px;
  font-weight: bold;
  letter-spacing: -1px;
  line-height: 1;
}
.now {
  height: 248px;
  padding: 28px 32px 20px 32px;
  vertical-align: middle;
}
.temp {
  font-size: 108px;
  font-weight: bold;
  line-height: 0.88;
}
.cond {
  font-size: 28px;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding-top: 8px;
}
.meta {
  font-size: 20px;
  padding-top: 8px;
}
.hair {
  height: 2px;
  background: #000000;
  font-size: 1px;
  line-height: 1px;
}
.fc-wrap {
  height: 176px;
  padding: 16px 20px 12px 20px;
  vertical-align: top;
}
.fc {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}
.fc td {
  width: 33%;
  text-align: center;
  vertical-align: top;
  padding: 8px 4px 4px 4px;
  border-left: 2px solid #000000;
}
.fc td.first {
  border-left: 0;
}
.fc-day {
  font-size: 16px;
  letter-spacing: 3px;
  text-transform: uppercase;
  padding-bottom: 8px;
}
.fc-hi {
  font-size: 36px;
  font-weight: bold;
  line-height: 1;
}
.fc-lo {
  font-size: 22px;
  padding-top: 4px;
}
.fc-cond {
  font-size: 18px;
  text-transform: uppercase;
  letter-spacing: 1px;
  padding-top: 10px;
}
.msg-cell {
  height: 206px;
  padding: 22px 32px 24px 32px;
  vertical-align: top;
  background: #000000;
  color: #ffffff;
}
.msg-label {
  font-size: 16px;
  letter-spacing: 4px;
  text-transform: uppercase;
  padding-bottom: 12px;
}
.msg {
  font-size: 28px;
  line-height: 1.32;
}
</style>
</head>
<body>
<table class="frame" cellspacing="0" cellpadding="0">
  <tr>
    <td class="hdr">
      <table class="hdr-inner" cellspacing="0" cellpadding="0">
        <tr>
          <td class="hdr-left">
            <div class="weekday" id="weekday">Friday</div>
            <div class="date" id="date">August 21, 2026</div>
          </td>
          <td class="hdr-right">
            <div class="time" id="time">11:39</div>
          </td>
        </tr>
      </table>
    </td>
  </tr>
  <tr>
    <td class="now">
      <div class="temp">20°</div>
      <div class="cond">Overcast</div>
      <div class="meta">Linz &nbsp;&middot;&nbsp; H 25°  /  L 12°   ·   75%</div>
    </td>
  </tr>
  <tr><td class="hair"></td></tr>
  <tr>
    <td class="fc-wrap"><table class='fc' cellspacing='0' cellpadding='0'><tr><td class='first'><div class='fc-day'>Fri</div><div class='fc-hi'>25°</div><div class='fc-lo'>12°</div><div class='fc-cond'>Rain</div></td><td class=''><div class='fc-day'>Sat</div><div class='fc-hi'>22°</div><div class='fc-lo'>12°</div><div class='fc-cond'>Overcast</div></td><td class=''><div class='fc-day'>Sun</div><div class='fc-hi'>22°</div><div class='fc-lo'>12°</div><div class='fc-cond'>Clear</div></td></tr></table></td>
  </tr>
  <tr>
    <td class="msg-cell">
      <div class="msg-label">Message</div>
      <div class="msg">Hello!</div>
    </td>
  </tr>
</table>
<script type="text/javascript">
(function () {
  var months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function tick() {
    var d = new Date();
    var w = document.getElementById("weekday");
    var da = document.getElementById("date");
    var t = document.getElementById("time");
    if (w) w.innerHTML = days[d.getDay()];
    if (da) da.innerHTML = months[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear();
    if (t) t.innerHTML = pad(d.getHours()) + ":" + pad(d.getMinutes());
  }
  tick();
  setInterval(tick, 15000);
})();
</script>
</body>
</html>
