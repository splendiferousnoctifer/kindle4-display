<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="refresh" content="60">
<meta name="viewport" content="width=600, height=800, user-scalable=no">
<title>Kindle</title>
<style type="text/css">
html, body {
  margin: 0;
  padding: 0;
  width: 600px;
  height: 800px;
  overflow: hidden;
  background: #ffffff;
  color: #000000;
  font-family: Georgia, "Times New Roman", serif;
}
.stage {
  width: 782px;
  height: 528px;
  overflow: hidden;
  -webkit-transform-origin: 0 0;
  -webkit-transform: translate(68px, 0) rotate(90deg) translate(0, -528px);
  transform-origin: 0 0;
  transform: translate(68px, 0) rotate(90deg) translate(0, -528px);
}
table.frame {
  width: 782px;
  height: 528px;
  border-collapse: collapse;
  table-layout: fixed;
}
td {
  padding: 0;
}
.hdr {
  height: 80px;
  background: #000000;
  color: #ffffff;
}
.hdr-inner {
  width: 100%;
  border-collapse: collapse;
}
.hdr-left {
  padding: 18px 0 16px 28px;
  vertical-align: middle;
  width: 55%;
}
.hdr-right {
  padding: 12px 28px 12px 0;
  vertical-align: middle;
  text-align: right;
  width: 45%;
}
.weekday {
  font-size: 18px;
  letter-spacing: 4px;
  text-transform: uppercase;
}
.date {
  font-size: 24px;
  padding-top: 4px;
}
.time {
  font-size: 50px;
  font-weight: bold;
  letter-spacing: -1px;
  line-height: 1;
}
.body {
  height: 348px;
}
.body-inner {
  width: 100%;
  height: 348px;
  border-collapse: collapse;
  table-layout: fixed;
}
.now {
  width: 250px;
  padding: 20px 16px 16px 22px;
  vertical-align: middle;
  border-right: 3px solid #000000;
}
.temp {
  font-size: 80px;
  font-weight: bold;
  line-height: 0.88;
}
.cond {
  font-size: 22px;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding-top: 8px;
}
.meta {
  font-size: 18px;
  padding-top: 8px;
}
.fc-wrap {
  width: 532px;
  padding: 6px 18px 6px 16px;
  vertical-align: middle;
}
.hours {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}
.hours td {
  padding: 8px 6px;
  border-top: 2px solid #000000;
  vertical-align: middle;
}
.hours tr.first td {
  border-top: 0;
}
.h-time {
  width: 90px;
  font-size: 22px;
}
.h-temp {
  width: 90px;
  font-size: 34px;
  font-weight: bold;
  line-height: 1;
}
.h-cond {
  font-size: 22px;
  text-transform: uppercase;
}
.msg-cell {
  height: 100px;
  padding: 14px 22px 12px 22px;
  vertical-align: middle;
  background: #000000;
  color: #ffffff;
}
.msg {
  font-size: 28px;
  line-height: 1.3;
}
</style>
</head>
<body>
<div class="stage">
<table class="frame" cellspacing="0" cellpadding="0">
  <tr>
    <td class="hdr">
      <table class="hdr-inner" cellspacing="0" cellpadding="0">
        <tr>
          <td class="hdr-left">
            <div class="weekday" id="weekday">Friday</div>
            <div class="date" id="date">August 21, 2026</div>
          </td>
          <td class="hdr-right">
            <div class="time" id="time">12:21</div>
          </td>
        </tr>
      </table>
    </td>
  </tr>
  <tr>
    <td class="body">
      <table class="body-inner" cellspacing="0" cellpadding="0">
        <tr>
          <td class="now">
            <div class="temp">21°</div>
            <div class="cond">Overcast</div>
            <div class="meta">Linz &nbsp;&middot;&nbsp; H 25°  /  L 12°   ·   62%</div>
          </td>
          <td class="fc-wrap"><table class='hours' cellspacing='0' cellpadding='0'><tr class='first'><td class='h-time'>12:00</td><td class='h-temp'>22°</td><td class='h-cond'>Clouds</td></tr><tr><td class='h-time'>15:00</td><td class='h-temp'>25°</td><td class='h-cond'>Clouds</td></tr><tr><td class='h-time'>18:00</td><td class='h-temp'>23°</td><td class='h-cond'>Rain</td></tr><tr><td class='h-time'>21:00</td><td class='h-temp'>13°</td><td class='h-cond'>Rain</td></tr></table></td>
        </tr>
      </table>
    </td>
  </tr>
  <tr>
    <td class="msg-cell">
      <div class="msg">Hello!</div>
    </td>
  </tr>
</table>
</div>
<script type="text/javascript">
(function () {
  var h = 12;
  var m = 21;
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function show() {
    var t = document.getElementById("time");
    if (t) t.innerHTML = pad(h) + ":" + pad(m);
  }
  show();
  setInterval(function () {
    m++;
    if (m >= 60) { m = 0; h++; }
    if (h >= 24) { h = 0; }
    show();
  }, 60000);
})();
</script>
</body>
</html>
