<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="refresh" content="60">
<meta name="viewport" content="width=600, height=800, user-scalable=no">
<title>Kindle</title>
<style type="text/css">
html, body {
  margin: 0;
  padding: 0;
  width: 600px;
  height: 800px;
  overflow: hidden;
  background: #ffffff;
  color: #000000;
  font-family: Georgia, "Times New Roman", serif;
}
.stage {
  width: 774px;
  height: 600px;
  overflow: hidden;
  -webkit-transform-origin: 0 0;
  -webkit-transform: rotate(90deg) translate(0, -600px);
  transform-origin: 0 0;
  transform: rotate(90deg) translate(0, -600px);
}
table.frame {
  width: 774px;
  height: 600px;
  border-collapse: collapse;
  table-layout: fixed;
}
td {
  padding: 0;
}
.hdr {
  height: 110px;
  background: #000000;
  color: #ffffff;
}
.hdr-inner {
  width: 100%;
  border-collapse: collapse;
}
.hdr-left {
  padding: 8px 0 8px 16px;
  vertical-align: top;
  text-align: left;
  width: 58%;
}
.hdr-right {
  padding: 8px 16px 8px 0;
  vertical-align: top;
  text-align: right;
  width: 42%;
}
.weekday {
  font-size: 18px;
  letter-spacing: 2px;
  line-height: 1.1;
  text-transform: uppercase;
}
.date {
  font-size: 22px;
  padding-top: 6px;
  line-height: 1.1;
}
.time {
  font-size: 40px;
  font-weight: bold;
  letter-spacing: 0;
  line-height: 1;
}
.body {
  height: 382px;
}
.body-inner {
  width: 100%;
  height: 382px;
  border-collapse: collapse;
  table-layout: fixed;
}
.now {
  width: 247px;
  padding: 13px 18px 13px 18px;
  vertical-align: top;
  text-align: left;
  border-right: 3px solid #000000;
}
.temp {
  font-size: 79px;
  font-weight: bold;
  line-height: 0.88;
}
.cond {
  font-size: 24px;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding-top: 9px;
}
.meta {
  font-size: 20px;
  padding-top: 9px;
}
.fc-wrap {
  width: 527px;
  padding: 9px 18px 9px 18px;
  vertical-align: top;
  text-align: left;
}
.hours {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}
.hours td {
  padding: 9px 7px 9px 0;
  border-top: 2px solid #000000;
  vertical-align: top;
  text-align: left;
}
.hours tr.first td {
  border-top: 0;
}
.h-time {
  width: 99px;
  font-size: 24px;
}
.h-temp {
  width: 99px;
  font-size: 37px;
  font-weight: bold;
  line-height: 1;
}
.h-cond {
  font-size: 24px;
  text-transform: uppercase;
}
.msg-cell {
  height: 108px;
  padding: 12px 16px 12px 16px;
  vertical-align: top;
  text-align: left;
  background: #000000;
  color: #ffffff;
}
.msg {
  font-size: 31px;
  line-height: 1.3;
}
</style>
</head>
<body>
<div class="stage">
<table class="frame" cellspacing="0" cellpadding="0">
  <tr>
    <td class="hdr">
      <table class="hdr-inner" cellspacing="0" cellpadding="0">
        <tr>
          <td class="hdr-left">
            <div class="weekday" id="weekday">Saturday</div>
            <div class="date" id="date">August 22, 2026</div>
          </td>
          <td class="hdr-right">
            <div class="time" id="time">05:11</div>
          </td>
        </tr>
      </table>
    </td>
  </tr>
  <tr>
    <td class="body">
      <table class="body-inner" cellspacing="0" cellpadding="0">
        <tr>
          <td class="now">
            <div class="temp">13°</div>
            <div class="cond">Overcast</div>
            <div class="meta">Linz &nbsp;&middot;&nbsp; H 22°  /  L 13°   ·   91%</div>
          </td>
          <td class="fc-wrap"><table class='hours' cellspacing='0' cellpadding='0'><tr class='first'><td class='h-time'>06:00</td><td class='h-temp'>13°</td><td class='h-cond'>Fog</td></tr><tr><td class='h-time'>09:00</td><td class='h-temp'>16°</td><td class='h-cond'>Clouds</td></tr><tr><td class='h-time'>12:00</td><td class='h-temp'>20°</td><td class='h-cond'>Clear</td></tr><tr><td class='h-time'>15:00</td><td class='h-temp'>22°</td><td class='h-cond'>Clear</td></tr></table></td>
        </tr>
      </table>
    </td>
  </tr>
  <tr>
    <td class="msg-cell">
      <div class="msg">Todays Tasks:<br>- water plants<br>- prepare dinner</div>
    </td>
  </tr>
</table>
</div>
<script type="text/javascript">
(function () {
  var h = 5;
  var m = 11;
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function show() {
    var t = document.getElementById("time");
    if (t) t.innerHTML = pad(h) + ":" + pad(m);
  }
  show();
  setInterval(function () {
    m++;
    if (m >= 60) { m = 0; h++; }
    if (h >= 24) { h = 0; }
    show();
  }, 60000);
})();
</script>
</body>
</html>
